simple_icons_version = "16.21.0"
lucide_version = "1.34.0"

# This table is the single source of truth for checked-in icon assets. Values
# use "provider:upstream-slug".
#
# Nearly every UI glyph comes from `gpui_component::IconName` instead — the enum
# naming the SVGs of `gpui-kit-assets`' default bundle — and a glyph that set
# lacks is picked by name from the kit's complete Lucide catalog, in
# `crates/app/src/icons.rs`, with its reason beside it. Only two kinds of thing
# are checked in here, because the kit cannot supply them:
#
#   * a brand mark, which belongs to the product it stands for rather than to a
#     general-purpose UI kit;
#   * a shape the kit *does* draw, forked for its stroke weight alone, which is
#     narrower than it looks. The weight lives in the file and no API reaches
#     it, so an icon drawn much larger than the app draws icons anywhere else
#     has no way to be lighter. Every such entry names the one place it is
#     drawn, keeps the library's copy in use everywhere else, and is `-light` so
#     nobody has to guess why two names exist for one drawing.
# An entry is added when a call site needs it, never in advance. The registry
# carries `allow(dead_code)` because it mirrors this table, so an abandoned
# asset looks exactly like a curated one and nothing will ever ask about it —
# a brand mark for the default agent sat here unused, in the binary, for
# exactly that reason.

# Stroke weight to rewrite into a Lucide icon after it is fetched, where the
# upstream 2 is wrong for the size the app draws it at. Absent means untouched,
# which is every icon that stands beside the library's own at the library's own
# size. Brand marks are filled rather than stroked and never appear here.
#
# It is a table and not a per-file edit because `sync-icons.sh` refetches every
# checked-in SVG from upstream: a weight edited into the file by hand is one the
# next sync silently throws away.
[stroke]
plus-light = "1.5"
arrow-up-light = "1.5"

[icons]
# The composer's `+`, which opens the attach-or-mention menu, and its Send
# arrow. Both are shapes `IconName` already draws, forked for one reason: the
# composer's action row letters its icons at 1.25rem where the rest of the app
# draws them at about 0.75rem, and Lucide's stroke of 2 reads as a marker pen at
# that size. The library's own copies stay in use at every other call site --
# the rail's *New session*, the terminal's *New terminal* -- so the weight is
# split by where a glyph is drawn rather than by which glyph it is.
plus-light = "lucide:plus"
arrow-up-light = "lucide:arrow-up"
