simple_icons_version = "16.21.0"
lucide_version = "1.34.0"

# This table is the single source of truth for checked-in icon assets. Values
# use "provider:upstream-slug".
#
# Nearly every UI glyph comes from `gpui_component::IconName` instead — the enum
# generated from the SVGs `gpui-component-assets` ships. Only two kinds of thing
# are checked in here, because that set cannot supply them:
#
#   * a brand mark, which belongs to the product it stands for rather than to a
#     general-purpose UI kit;
#   * a glyph the bundled set holds no equivalent of at all, added one at a time
#     with its reason written beside it. That is not a door back to a
#     self-hosted UI set: when `IconName` already carries the shape, the entry
#     does not belong here, whatever it would be named.
# An entry is added when a call site needs it, never in advance. The registry
# carries `allow(dead_code)` because it mirrors this table, so an abandoned
# asset looks exactly like a curated one and nothing will ever ask about it —
# a brand mark for the default agent sat here unused, in the binary, for
# exactly that reason.
[icons]
# The transcript's "Changed" activity group. The bundled set has no pencil of
# any kind, and its nearest shape is `replace` — a find-and-replace mark, which
# reads as swapping one box for another rather than as editing a file.
square-pen = "lucide:square-pen"
# Deleting an agent, in Settings' agent list. The bundled set has no waste bin
# of any kind: what it names `delete` is the backspace key, a rounded rectangle
# with an × in it, which says "erase the character behind the caret" beside a
# row that removes a saved definition for good. Its `close` and `circle-x` say
# "dismiss this", which is the one thing the button does not do.
trash-2 = "lucide:trash-2"
# Splitting a project onto its own branch, in the project row's menu. The
# bundled set holds no branch, fork or split of any kind — its only git-adjacent
# drawing is the GitHub brand mark, which names a website rather than the
# operation.
git-branch = "lucide:git-branch"
# Staging a file onto the prompt being written. The bundled set holds no clip,
# pin or paperclip of any kind; the nearest thing it draws is `inbox`, a tray
# that says mail has arrived — the opposite direction from handing a file to the
# agent.
paperclip = "lucide:paperclip"
# The composer's mention button, which inserts an `@`. The bundled set has no
# at-sign; the nearest mark it draws is `asterisk`, which is a different
# character, and a button whose whole job is to say which character it types
# cannot draw another one. This button is also the only route to a mention for
# anyone whose input method swallows the typed character, so guessing at it is
# not an option the user has.
at-sign = "lucide:at-sign"
# The composer's slash-command button, which inserts a `/`. The bundled set has
# no slash; its `dash` is a minus sign. Lucide's `command` is not this either —
# that is the ⌘ modifier key, which names a keystroke rather than the character
# being typed, and on this app's platform it names one that does not exist.
#
# The enclosed form and not the bare `slash`: at the 0.75rem these buttons draw
# at, a lone diagonal stroke has no weight beside the paperclip and the at-sign
# either side of it and reads as a separator between them rather than as a
# glyph of its own.
square-slash = "lucide:square-slash"
