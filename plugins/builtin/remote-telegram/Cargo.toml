[package]
name = "onehand-remote-telegram"
version = "0.1.0"
edition = "2024"

[lib]
name = "onehand_remote_telegram"
path = "src/lib.rs"

[dependencies]
onehand-core = { path = "../../../crates/core" }
onehand-plugin-api = { path = "../../../crates/plugin-api" }
onehand-plugin-host = { path = "../../../crates/plugin-host" }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
