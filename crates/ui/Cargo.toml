[package]
name = "onehand-ui"
version = "0.1.0"
edition = "2024"
description = "The widgets, tokens and surfaces every crate of Onehand draws with"
license = "MIT OR Apache-2.0"

[lib]
name = "onehand_ui"
path = "src/lib.rs"

[dependencies]
onehand-core = { path = "../core" }
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "9e3a29dcbdebc318632bf68203f26c33e9f0e902" }

[dev-dependencies]
# A test channel has to hand back a `Stream`, which is the trait's own currency.
futures = "0.3"
