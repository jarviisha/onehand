[package]
name = "onehand-ui"
version = "0.1.0"
edition = "2024"
description = "The widgets, tokens and surfaces every crate of Onehand draws with"
license = "MIT OR Apache-2.0"

[lib]
name = "onehand_ui"
path = "src/lib.rs"

[dependencies]
onehand-core = { path = "../core" }
gpui.workspace = true
gpui-component.workspace = true
# The resize handle and the splits it sits in, which gpui-component does not
# re-export: the splits are drawn here, in the app's own way.
gpui-base.workspace = true
