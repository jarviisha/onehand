[package]
name = "onehand-claude-plugins"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "onehand_claude_plugins"
path = "src/lib.rs"

[dependencies]
onehand-workbench = { path = "../workbench" }
onehand-ui = { path = "../ui" }
gpui.workspace = true
gpui-component.workspace = true
onehand-core = { path = "../core" }

[dev-dependencies]
# `TestAppContext`, to drive the view the way the panel does.
gpui = { workspace = true, features = ["test-support"] }
