[package]
name = "onehand"
version = "0.1.0"
edition = "2024"
description = "A desktop GUI host for AI coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarviisha/onehand"

# Edition 2024 matches gpui-component upstream, so its macros and async
# closures behave the same here as they do in its own workspace.

# Library + thin binary: the registry and asset plumbing stay reachable from
# tests without opening a window.
[lib]
name = "onehand"
path = "src/lib.rs"

[features]
terminal-profiling = ["gpui-terminal/profiling"]

[[bin]]
name = "onehand"
path = "src/main.rs"

[dependencies]
onehand-core = { path = "../core" }
onehand-workbench = { path = "../workbench" }
onehand-ui = { path = "../ui" }
onehand-terminal-ui = { path = "../terminal-ui" }
onehand-github = { path = "../github" }
onehand-telegram = { path = "../telegram" }
# No `onehand-files`: the file tree is the left half of the Editor mode and
# reaches the binary through that crate, which composes it.
onehand-editor = { path = "../editor" }
onehand-issues = { path = "../issues" }
onehand-markdown = { path = "../markdown" }
onehand-neovim = { path = "../neovim" }
onehand-claude-plugins = { path = "../claude-plugins" }

# The UI stack is pinned once, in the workspace manifest.
# The `tree-sitter-*` set is deliberately a *subset*, not `tree-sitter-languages`
# (all ~35). The Workbench stays a quick editor -- highlighting
# for the languages this codebase is edited in, and no LSP. Each grammar is
# build time and binary size for a language nobody has opened.
gpui-component = { workspace = true, features = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-markdown",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
] }
gpui-kit-assets.workspace = true
# The layer under gpui-component, named here for two things it re-exports no
# route to: the theme global a resize handle (painted by *that* layer) takes its
# colour from, and the text-selection scope that keeps a drag in its region.
gpui-base.workspace = true

gpui.workspace = true
gpui_platform.workspace = true

anyhow = "1"
# The machine's own time zone, which a schedule's cron expression is read in.
chrono = "0.4"
# Writes the base hues into a theme config: gpui-component keeps those slots
# private, so the config's own serde form is the only way in.
serde_json = "1"

# The ACP adapter's serve loop is tokio-based, so it needs a tokio reactor to be
# polled on; GPUI runs on smol. `crate::acp` owns the runtime that bridges them.
# `net`, `io-util` and `time` are the socket a second launch talks to (`crate::instance`).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
# `Stream` + the channel the two executors hand events across. Neither belongs
# to tokio or to smol, which is the point.
futures = "0.3"

# Native folder picker. Driven blocking on the background executor, never on the
# UI loop, where a modal native dialog would freeze every window.
rfd = "0.15"

# Desktop notification when a turn ends while the window is unfocused.
notify-rust = "4"

[dev-dependencies]
# Native renderer comparison fixture: selection and scroll transitions.
alacritty_terminal = "0.25.1"
# Vendored: upstream is a render core with no interaction layer at all.
# See vendor/gpui-terminal/Cargo.toml.
gpui-terminal = { path = "../../vendor/gpui-terminal" }
# Reads the pinned icon manifest in the registry consistency test.
toml = "0.8"
