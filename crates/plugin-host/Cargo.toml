description = "Onehand built-in plugin registry and contribution host"

[lib]
name = "onehand_plugin_host"
path = "src/lib.rs"

[dependencies]
onehand-plugin-api = { path = "../plugin-api" }
onehand-core = { path = "../core" }
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
