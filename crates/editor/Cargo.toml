[package]
name = "onehand-editor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "onehand_editor"
path = "src/lib.rs"

[dependencies]
onehand-workbench = { path = "../workbench" }
onehand-ui = { path = "../ui" }
onehand-core = { path = "../core" }
# The file tree is the left half of this mode. It stays a crate of its own,
# implementing the same trait, and is composed here rather than copied: what
# was two entries on the mode strip is one view with a divider down it.
onehand-files = { path = "../files" }
gpui.workspace = true
gpui-component = { workspace = true, features = [
    "tree-sitter", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx",
    "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go",
    "tree-sitter-markdown", "tree-sitter-toml", "tree-sitter-yaml",
    "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html",
] }
