[package]
name = "onehand-issues"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "onehand_issues"
path = "src/lib.rs"

[dependencies]
onehand-workbench = { path = "../workbench" }
onehand-ui = { path = "../ui" }
gpui.workspace = true
gpui-component.workspace = true
onehand-core = { path = "../core" }
# Already built into the app through gpui, clock feature included: named here
# for local time on an issue's history, not pulled in by it.
chrono = "0.4"

[dev-dependencies]
# `TestAppContext`, to hold the shared issues file's carrier to its contract.
gpui = { workspace = true, features = ["test-support"] }
# Core's fake connector, to hold the views' reads of the work to their contract.
onehand-core = { path = "../core", features = ["test-support"] }
