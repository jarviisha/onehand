# Vendored from https://github.com/zortax/gpui-terminal @ 51f0292 (MIT OR Apache-2.0).
#
# Why vendored rather than depended on: upstream is a good render core with no
# interaction layer at all -- selection, scrolling and clipboard are
# empty TODOs upstream, and that layer is where every one of onehand's terminal
# patches lives. Everything onehand adds is marked
# with an "onehand patch" comment, so the delta against upstream stays readable
# without a diff.
[package]
name = "gpui-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal emulator component for gpui (vendored)"

[features]
# onehand patch: diagnostic counters are absent from normal builds.
profiling = []

[dependencies]
# onehand patch: upstream takes `gpui` from crates.io. gpui-component takes the
# `gpui-pre` snapshot at an exact version, and any other gpui here would be a
# second one in the graph ("expected gpui::App, found App"), so this takes the
# workspace's, which is gpui-component's.
gpui.workspace = true
alacritty_terminal = "0.25.1"
portable-pty = "0.9"
ropey = "1"
parking_lot = "0.12"
flume = "0.12"
